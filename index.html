<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kashi — Generative Islamic Geometry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="art"></canvas>

  <div id="panel">
    <h1>KASHI</h1>

    <div class="section-title">Pattern</div>

    <div class="control">
      <label for="tiling">Tiling</label>
      <select id="tiling"></select>
    </div>

    <div class="control">
      <label for="theta">Contact angle θ <span id="theta-value"></span></label>
      <input type="range" id="theta" min="1" max="89" step="0.5">
    </div>

    <div class="control">
      <label for="delta">Offset δ <span id="delta-value"></span></label>
      <input type="range" id="delta" min="0" max="0.9" step="0.01">
    </div>

    <div class="section-title">Composition</div>

    <div class="control">
      <label for="tileSize">Tile size <span id="tileSize-value"></span></label>
      <input type="range" id="tileSize" min="30" max="220" step="1">
    </div>

    <div class="control">
      <label for="rotation">Rotation <span id="rotation-value"></span></label>
      <input type="range" id="rotation" min="0" max="90" step="1">
    </div>

    <div class="control">
      <label for="strapWidth">Strap width <span id="strapWidth-value"></span></label>
      <input type="range" id="strapWidth" min="1" max="16" step="0.5">
    </div>

    <div class="section-title">Colour</div>

    <div class="control">
      <label>Palette <span id="palette-name"></span></label>
      <div id="palettes"></div>
    </div>

    <div class="control checkbox">
      <input type="checkbox" id="fill">
      <label for="fill">Fill rosettes</label>
    </div>

    <div class="control checkbox">
      <input type="checkbox" id="showTiling">
      <label for="showTiling">Show tiling</label>
    </div>
  </div>

  <script src="kashi.js"></script>
</body>
</html>
